<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>雑貨店 - 手作り雑貨</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>雑貨店</h1>
    </header>
    <main class="container">
        <div class="main-content">
            <section class="controls">
                <label for="category-select">カテゴリ絞り込み：</label>
                <select id="category-select">
                    <option value="all">すべて</option>
                </select>

                <div class="tab-buttons">
                    <button id="tab-all" class="active">商品一覧</button>
                    <button id="tab-fav">お気に入り一覧</button>
                </div>
            </section>
            <section id="product-list" class="product-grid"></section>
        </div>

        <aside class="sidebar">
            <h2>ショッピングカート</h2>
            <div id="cart-list"></div>
            <div class="cart-summary">
                <p>小計: <span id="total-excl">0</span>円</p>
                <p class="total-price">合計: <span id="total-incl">0</span>円</p>
            </div>
        </aside>
    </main>
    <script src="app.js"></script>
</body>
</html>
